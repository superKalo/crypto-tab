name: Request a token
description: Suggest a token for price tracking in Crypto Tab.
title: 'Token request: '
body:
    - type: input
      id: token-name
      attributes:
          label: Token name
          placeholder: e.g. Ambire Wallet
      validations:
          required: true
    - type: input
      id: token-symbol
      attributes:
          label: Token symbol
          placeholder: e.g. WALLET
      validations:
          required: true
    - type: input
      id: coingecko-url
      attributes:
          label: CoinGecko URL
          description: Link to the token's CoinGecko page.
          placeholder: https://www.coingecko.com/en/coins/ambire-wallet
      validations:
          required: true
    - type: textarea
      id: reason
      attributes:
          label: Why you'd like to follow this token
      validations:
          required: false
