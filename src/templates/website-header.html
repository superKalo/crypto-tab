<header class="website-header" aria-label="Crypto Tab preview and installation">
  <div class="website-intro">
    <div class="website-identity">
      <img src="img/logo.svg" width="28" height="28" alt="" />
      <p class="website-brand">Crypto Tab</p>
      <span class="website-preview-label">interactive preview</span>
    </div>
    <p class="website-description">Add the extension to make this your New Tab page.</p>
  </div>
  <div class="install">
    <a
      class="install__link"
      target="_blank"
      rel="noopener noreferrer"
      href="https://chromewebstore.google.com/detail/crypto-tab/hmbkmkdhhlgemdgeefnhfaffdpddohpa"
    >
      <img class="install__icon" src="img/browsers/chrome.svg" alt="" width="24" height="24" />
      <span class="install_title">Add to Chrome</span>
    </a>

    <a
      class="install__link"
      target="_blank"
      rel="noopener noreferrer"
      href="https://addons.mozilla.org/en-US/firefox/addon/crypto-tab/"
    >
      <img class="install__icon" src="img/browsers/firefox.svg" alt="" width="24" height="24" />
      <span class="install_title">Add to Firefox</span>
    </a>
  </div>
</header>
